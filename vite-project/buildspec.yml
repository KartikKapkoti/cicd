
version: 0.2

phases:
  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 150619449300.dkr.ecr.ap-south-1.amazonaws.com
      - REPOSITORY_URI=150619449300.dkr.ecr.ap-south-1.amazonaws.com/react-app
      - IMAGE_TAG=$(echo "$CODEBUILD_RESOLVED_SOURCE_VERSION" | cut -c 1-7)

  build:
    commands:
      - echo "Building Docker image..."
      - docker build -t "$REPOSITORY_URI:$IMAGE_TAG" .
      - docker tag "$REPOSITORY_URI:$IMAGE_TAG" "$REPOSITORY_URI:latest"

  post_build:
    commands:
      - echo "Pushing Docker images to ECR..."
      - docker push "$REPOSITORY_URI:$IMAGE_TAG"
      - docker push "$REPOSITORY_URI:latest"
      - echo "$REPOSITORY_URI:$IMAGE_TAG" > imageUri.txt

      - echo "Testing SSM connection to EC2..."

      - |
        aws ssm send-command \
          --instance-ids "$EC2_INSTANCE_ID" \
          --document-name "AWS-RunShellScript" \
          --parameters '{"commands":["whoami","docker --version","aws --version"]}' \
          --region ap-south-1

artifacts:
  files:
    - appspec.yml
    - imageUri.txt
    - scripts/**/*
